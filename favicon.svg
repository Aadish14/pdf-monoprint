<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <!-- Background Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  
  <!-- Top Paper Input -->
  <path d="M20 12h24v10H20z" fill="#e0e7ff" />
  
  <!-- Printer Main Body -->
  <rect x="12" y="20" width="40" height="20" rx="4" fill="#ffffff" />
  
  <!-- Green Power/Ready LED Indicator -->
  <circle cx="45" cy="26" r="2.2" fill="#10b981" />
  
  <!-- Output Paper Slot -->
  <rect x="17" y="32" width="30" height="3" rx="1.5" fill="#94a3b8" />
  
  <!-- Printed Document with Hatching -->
  <path d="M19 33h26v18a2 2 0 0 1-2 2H21a2 2 0 0 1-2-2V33z" fill="#ffffff" />
  <rect x="19" y="33" width="26" height="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="1.5" />
  
  <!-- Tactile Hatch Lines on Output Document -->
  <line x1="23" y1="38" x2="41" y2="38" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <line x1="23" y1="43" x2="35" y2="43" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
  <line x1="23" y1="48" x2="39" y2="48" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
</svg>
