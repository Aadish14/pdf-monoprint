<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandTriad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a53f2b" />
      <stop offset="60%" stop-color="#55446f" />
      <stop offset="100%" stop-color="#2a3a70" />
    </linearGradient>
  </defs>
  <!-- Background Icon Container with Terracotta-to-Navy gradient -->
  <rect width="64" height="64" rx="16" fill="url(#brandTriad)" />
  
  <!-- Top Paper Input (Soft Periwinkle Tint) -->
  <path d="M20 12h24v10H20z" fill="#c6d4ff" />
  
  <!-- Printer Main Body -->
  <rect x="12" y="20" width="40" height="20" rx="4" fill="#ffffff" />
  
  <!-- Power/Ready LED Indicator (Mint/Light Green) -->
  <circle cx="45" cy="26" r="2.5" fill="#99f7ab" />
  
  <!-- Output Paper Slot -->
  <rect x="17" y="32" width="30" height="3" rx="1.5" fill="#94a3b8" />
  
  <!-- Printed Document with Hatching -->
  <path d="M19 33h26v18a2 2 0 0 1-2 2H21a2 2 0 0 1-2-2V33z" fill="#ffffff" />
  <rect x="19" y="33" width="26" height="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="1.5" />
  
  <!-- Tactile Hatch Lines (Featuring Periwinkle and Terracotta accents) -->
  <line x1="23" y1="38" x2="41" y2="38" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <line x1="23" y1="43" x2="35" y2="43" stroke="#a53f2b" stroke-width="2" stroke-linecap="round" />
  <line x1="23" y1="48" x2="39" y2="48" stroke="#c6d4ff" stroke-width="2.2" stroke-linecap="round" />
</svg>
